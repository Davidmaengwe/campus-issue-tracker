<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track a Report</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">Campus Issue Tracker</span>
      <div>
        <a class="text-white me-3" href="/index.html">Report</a>
        <a class="text-white" href="/track.html">Track</a>
      </div>
    </div>
  </nav>

  <div class="container" style="max-width: 600px;">
    <h3>Track Your Report</h3>
    <div class="input-group mb-3">
      <input type="text" id="codeInput" class="form-control" placeholder="Enter code, e.g. CIT-A7K2P">
      <button id="checkBtn" class="btn btn-primary">Check</button>
    </div>
    <div id="result"></div>
  </div>

  <script>
    const colors = {
      'Submitted': 'secondary',
      'In Progress': 'warning',
      'Resolved': 'success'
    };

    function esc(text) {
      const div = document.createElement('div');
      div.textContent = text == null ? '' : text;
      return div.innerHTML;
    }

    document.getElementById('checkBtn').addEventListener('click', async () => {
      const code = document.getElementById('codeInput').value.trim().toUpperCase();
      const box = document.getElementById('result');

      if (!code) {
        box.innerHTML = '<div class="alert alert-warning">Please enter your tracking code.</div>';
        return;
      }

      try {
        const res = await fetch('/api/reports/' + encodeURIComponent(code));
        if (!res.ok) {
          box.innerHTML = '<div class="alert alert-danger">Report not found. Check your code and try again.</div>';
          return;
        }
        const data = await res.json();
        const color = colors[data.status] || 'secondary';
        box.innerHTML =
          '<div class="card"><div class="card-body">' +
          '<p class="mb-1"><strong>Status:</strong> <span class="badge bg-' + color + '">' + esc(data.status) + '</span></p>' +
          '<p class="mb-1"><strong>Category:</strong> ' + esc(data.category) + '</p>' +
          '<p class="mb-1"><strong>Building:</strong> ' + esc(data.building) + '</p>' +
          '<p class="mb-0"><strong>Reported:</strong> ' + esc(data.created_at) + '</p>' +
          '</div></div>';
      } catch (err) {
        box.innerHTML = '<div class="alert alert-danger">Could not reach the server. Try again.</div>';
      }
    });
  </script>
</body>
</html>
