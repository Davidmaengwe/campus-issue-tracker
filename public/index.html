<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report a Campus Issue</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">Campus Issue Tracker</span>
      <div>
        <a class="text-white me-3" href="/index.html">Report</a>
        <a class="text-white me-3" href="/track.html">Track</a>
        <a class="text-white" href="/admin.html">Admin</a>
      </div>
    </div>
  </nav>

  <div class="container" style="max-width: 600px;">
    <h3>Report an Issue</h3>
    <div id="message"></div>

    <form id="reportForm">
      <div class="mb-3">
        <label class="form-label">Your name</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Category</label>
        <select name="category" class="form-select" required>
          <option value="">Choose...</option>
          <option>Water</option>
          <option>Electricity</option>
          <option>Security</option>
          <option>Sanitation</option>
          <option>Other</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Building</label>
        <select name="building" class="form-select" required>
          <option value="">Choose...</option>
          <option>Library</option>
          <option>Main Hall</option>
          <option>Hostel A</option>
          <option>Hostel B</option>
          <option>Cafeteria</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="3" required></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Photo (optional)</label>
        <input type="file" name="photo" accept="image/*" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary">Submit Report</button>
    </form>
  </div>

  <script>
    document.getElementById('reportForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const box = document.getElementById('message');
      try {
        const res = await fetch('/api/reports', { method: 'POST', body: formData });
        const data = await res.json();
        box.innerHTML = '<div class="alert alert-success">Report submitted! Your tracking code is <strong>' +
          data.code + '</strong>. Save it to check your status.</div>';
        e.target.reset();
      } catch (err) {
        box.innerHTML = '<div class="alert alert-danger">Something went wrong. Try again.</div>';
      }
    });
  </script>
</body>
</html>
