<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">Campus Issue Tracker &middot; Staff</span>
    </div>
  </nav>

  <div class="container">
    <h3>Staff Dashboard</h3>
    <div id="message"></div>

    <div id="loginBox" class="mb-3" style="max-width: 400px;">
      <input type="text" id="usernameInput" class="form-control mb-2" placeholder="Username">
      <input type="password" id="passwordInput" class="form-control mb-2" placeholder="Password">
      <button id="loginBtn" class="btn btn-dark w-100">Log in</button>
    </div>

    <div id="dashboard" style="display: none;">
      <button id="logoutBtn" class="btn btn-outline-secondary btn-sm mb-3">Log out</button>
      <div class="table-responsive">
        <table class="table table-bordered align-middle">
          <thead class="table-light">
            <tr>
              <th>Code</th>
              <th>Category</th>
              <th>Building</th>
              <th>Description</th>
              <th>Photo</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const statuses = ['Submitted', 'In Progress', 'Resolved'];

    function esc(text) {
      const div = document.createElement('div');
      div.textContent = text == null ? '' : text;
      return div.innerHTML;
    }

    function showMessage(text, type) {
      document.getElementById('message').innerHTML =
        '<div class="alert alert-' + type + '">' + esc(text) + '</div>';
    }

    function getToken() {
      return sessionStorage.getItem('staffToken');
    }

    function showLogin() {
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('loginBox').style.display = 'block';
    }

    async function loadReports() {
      const res = await fetch('/api/admin/reports', {
        headers: { 'x-staff-token': getToken() }
      });

      if (res.status === 401) {
        sessionStorage.removeItem('staffToken');
        showLogin();
        showMessage('Please log in again.', 'danger');
        return;
      }

      const reports = await res.json();
      document.getElementById('message').innerHTML = '';
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';

      const body = document.getElementById('tableBody');
      body.innerHTML = '';

      reports.forEach((r) => {
        const photo = r.photo
          ? '<a href="/uploads/' + esc(r.photo) + '" target="_blank">' +
            '<img src="/uploads/' + esc(r.photo) + '" style="height:50px;"></a>'
          : '-';

        const options = statuses.map((s) =>
          '<option' + (s === r.status ? ' selected' : '') + '>' + s + '</option>'
        ).join('');

        body.innerHTML +=
          '<tr>' +
          '<td>' + esc(r.code) + '</td>' +
          '<td>' + esc(r.category) + '</td>' +
          '<td>' + esc(r.building) + '</td>' +
          '<td>' + esc(r.description) + '</td>' +
          '<td>' + photo + '</td>' +
          '<td><select class="form-select form-select-sm status-select" data-id="' + r.id + '">' +
          options + '</select></td>' +
          '</tr>';
      });
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const res = await fetch('/api/staff/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('usernameInput').value,
          password: document.getElementById('passwordInput').value
        })
      });

      if (!res.ok) {
        showMessage('Wrong username or password.', 'danger');
        return;
      }

      const data = await res.json();
      sessionStorage.setItem('staffToken', data.token);
      document.getElementById('passwordInput').value = '';
      loadReports();
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('staffToken');
      location.reload();
    });

    document.getElementById('tableBody').addEventListener('change', async (e) => {
      if (!e.target.classList.contains('status-select')) return;
      const id = e.target.dataset.id;
      const res = await fetch('/api/admin/reports/' + id, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'x-staff-token': getToken()
        },
        body: JSON.stringify({ status: e.target.value })
      });
      if (res.ok) {
        showMessage('Status updated.', 'success');
      } else {
        showMessage('Update failed. Please log in again.', 'danger');
      }
    });

    if (getToken()) {
      loadReports();
    }
  </script>
</body>
</html>
